# 默认配置：连接 docker-compose.yml 起的中间件。
# 所有值都能用环境变量覆盖（${变量名:默认值}），部署多个实例时只改环境变量，不改代码。
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: streamhub
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/streamhub?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:streamhub}
    password: ${DB_PASSWORD:streamhub}
    hikari:
      maximum-pool-size: 16
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s

streamhub:
  # 实例名：不填就随机生成。workerId 租约、MQ 客户端名都用它
  node-id: ${STREAMHUB_NODE_ID:node-${random.int[100000,999999]}}
  # -1 = 从 Redis 自动抢；填 0-1023 = 手动指定（决策 2B 允许环境变量覆盖）
  worker-id: ${STREAMHUB_WORKER_ID:-1}
  ws-port: ${WS_PORT:9100}
  io-threads: ${IO_THREADS:0}
  # 开发用默认密钥，生产必须用环境变量 JWT_SECRET 换掉（Base64，至少 32 字节）
  jwt-secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAwMDAwMDAwMDA=}
  dev-endpoints: ${DEV_ENDPOINTS:false}
  rocketmq:
    name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
    topic: ${ROCKETMQ_TOPIC:danmaku}
    queues: 8
    # 推送只关心实时：发出超过 10 秒的消息不再推（例如节点重启后读到的积压）
    push-max-age-ms: 10000
  room:
    window-ms: ${MERGE_WINDOW_MS:100}     # 固定合并窗口（决策 5A）；0 = 关闭合并
    max-items: ${MERGE_MAX_ITEMS:50}
    max-frame-bytes: 16384
  ingest:
    max-in-flight: ${MAX_IN_FLIGHT:2000}  # 已发给 MQ 还没确认的最多这么多，满了回 BUSY
    user-rate-per-sec: ${USER_RATE:5}     # 每个用户每秒 5 条
    user-burst: ${USER_BURST:10}          # 允许短时间连发 10 条
    video-cache-seconds: 30
  persist:
    batch-size: ${PERSIST_BATCH:200}
    threads: ${PERSIST_THREADS:4}
