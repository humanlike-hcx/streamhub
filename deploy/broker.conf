# Broker 配置
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
namesrvAddr=namesrv:9876
# 关键：Broker 会把这个地址注册给 NameServer，客户端拿到后直接连它。
# 应用跑在宿主机（Mac）上，所以要填宿主机能访问的地址，而不是容器内部 IP。
brokerIP1=127.0.0.1
# 开发环境允许自动建 topic；生产环境应关掉，用命令显式创建
autoCreateTopicEnable=true
flushDiskType=ASYNC_FLUSH
# 默认 commitlog 文件 1GB，开发机调小
mappedFileSizeCommitLog=268435456
# 自动建 topic 时默认 8 个队列：落库消费者最多 8 路并行
defaultTopicQueueNums=8
# 一次拉取最多返回多少条（默认只有 32 条，消费者批量写库时会被它卡住吞吐）
maxTransferCountOnMessageInMemory=1024
maxTransferBytesOnMessageInMemory=1048576
